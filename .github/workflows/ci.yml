name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:licenses
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            apps/editor/coverage/editor/coverage-summary.json
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: coschema
          POSTGRES_PASSWORD: coschema
          POSTGRES_DB: coschema
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U coschema -d coschema"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://coschema:coschema@127.0.0.1:5432/coschema
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: SIM_RUNS=500 pnpm test:sim
      - run: pnpm sim --seeds 5000 --budget 480 --bail
      - name: The simulator must catch an injected bug
        run: |
          if pnpm sim --seeds 20 --bail --inject lose-log --out bench/results/tmp/injected.json; then
            echo "the simulator passed with a bug injected"
            exit 1
          fi
      - run: cat bench/results/sim.json
        if: always()
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: sim-results
          path: bench/results/sim.json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: coschema
          POSTGRES_PASSWORD: coschema
          POSTGRES_DB: coschema
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U coschema -d coschema"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://coschema:coschema@127.0.0.1:5432/coschema
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @coschema/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:pages
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: playwright
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @coschema/e2e exec playwright install --with-deps chromium
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: lighthouse
          path: bench/results/lighthouse.json

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:compose

  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
