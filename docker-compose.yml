name: coschema

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: coschema
      POSTGRES_PASSWORD: coschema
      POSTGRES_DB: coschema
    volumes:
      - coschema-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coschema -d coschema']
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - coschema-net

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COSCHEMA_HOST: 0.0.0.0
      COSCHEMA_PORT: '4218'
      COSCHEMA_STORE: postgres
      DATABASE_URL: postgres://coschema:coschema@postgres:5432/coschema
      COSCHEMA_JWT_SECRET: ${COSCHEMA_JWT_SECRET:-coschema-compose-local-secret}
      COSCHEMA_DEV_TOKENS: '1'
      COSCHEMA_ALLOWED_ORIGINS: ${COSCHEMA_ALLOWED_ORIGINS:-http://127.0.0.1:4217,http://localhost:4217,http://127.0.0.1:4280,http://localhost:4280}
    ports:
      - '127.0.0.1:4218:4218'
    stop_grace_period: 15s
    networks:
      - coschema-net

volumes:
  coschema-pgdata:

networks:
  coschema-net:
